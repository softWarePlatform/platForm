apiVersion: v1
kind: Service
metadata:
  name: lab-practice-service
spec:
  selector:
    app.kubernetes.io/name: lab-practice-service
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-practice-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-practice-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-practice-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: lab-practice-service
          image: teaching-platform-lab-practice-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://redis:6379
            - name: JUDGE_QUEUE_NAME
              value: judge-submissions
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: INTERNAL_SERVICE_TOKEN
            - name: COURSE_SERVICE_URL
              value: http://course-service:3001
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            - name: CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: CORS_ORIGIN
            - name: UPLOAD_DIR
              value: /app/uploads
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: api-uploads

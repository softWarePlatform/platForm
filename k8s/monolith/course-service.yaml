apiVersion: v1
kind: Service
metadata:
  name: course-service
spec:
  selector:
    app.kubernetes.io/name: course-service
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: course-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: course-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: course-service
          image: teaching-platform-course-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: platform-secrets, key: COURSE_DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: platform-secrets, key: JWT_SECRET } }
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: platform-secrets, key: INTERNAL_SERVICE_TOKEN } }
            - name: CORS_ORIGIN
              valueFrom: { secretKeyRef: { name: platform-secrets, key: CORS_ORIGIN } }
            - name: HOMEWORK_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: platform-config, key: HOMEWORK_SERVICE_URL } }
            - name: LAB_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: platform-config, key: LAB_SERVICE_URL } }
            - name: UPSTREAM_TIMEOUT_MS
              valueFrom: { configMapKeyRef: { name: platform-config, key: UPSTREAM_TIMEOUT_MS } }
            - name: UPLOAD_DIR
              value: /app/uploads
          startupProbe:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: uploads, mountPath: /app/uploads }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: api-uploads }

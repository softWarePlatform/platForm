apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: teaching-platform
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - judge-worker.yaml
  - web.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: teaching-platform

# API、Web、Worker 已在各自清单中声明 ghcr-pull。
# db-migrate 也已声明 ghcr-pull，由工作流单独创建并等待完成后才部署应用。

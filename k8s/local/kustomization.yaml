apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../monolith
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
  - target:
      kind: Deployment
      name: judge-worker
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
  - target:
      kind: Deployment
      name: lab-practice-service
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">单体与微服务性能对比</title>
  <desc id="desc">并发十、每接口三十请求、三轮中位数。左图为吞吐量 QPS，右图为 P95 响应时间，数值越高的吞吐量更好、数值越低的 P95 更好。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #4b5563; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .axis { stroke: #64748b; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .label { font-size: 15px; }
    .value { font-size: 14px; font-weight: 700; }
    .legend { font-size: 15px; }
    .mono { fill: #2563eb; }
    .micro { fill: #f97316; }
  </style>
  <text x="60" y="55" class="title">单体与微服务性能对比</text>
  <text x="60" y="82" class="subtitle">同机 · 相同数据形态 · 并发 10 · 每接口 30 请求 · 三轮中位数 · 错误率均为 0</text>
  <rect class="panel" x="60" y="125" width="530" height="500" rx="4"/>
  <rect class="panel" x="630" y="125" width="510" height="500" rx="4"/>
  <text x="85" y="165" class="title" style="font-size:20px">吞吐量（QPS，越高越好）</text>
  <text x="655" y="165" class="title" style="font-size:20px">P95 响应时间（ms，越低越好）</text>
  <line class="axis" x1="165" y1="560" x2="555" y2="560"/>
  <line class="axis" x1="745" y1="560" x2="1105" y2="560"/>
  <g class="grid">
    <line x1="165" y1="230" x2="555" y2="230"/><line x1="165" y1="340" x2="555" y2="340"/><line x1="165" y1="450" x2="555" y2="450"/>
    <line x1="745" y1="230" x2="1105" y2="230"/><line x1="745" y1="340" x2="1105" y2="340"/><line x1="745" y1="450" x2="1105" y2="450"/>
  </g>
  <g class="label"><text x="75" y="272">Dashboard</text><text x="75" y="382">作业列表</text><text x="75" y="492">实验总览</text><text x="655" y="272">Dashboard</text><text x="655" y="382">作业列表</text><text x="655" y="492">实验总览</text></g>
  <g>
    <rect class="mono" x="165" y="235" width="33" height="28"/><text class="value" x="204" y="255">128.06</text><rect class="micro" x="165" y="270" width="177" height="28"/><text class="value" x="348" y="290">679.50</text>
    <rect class="mono" x="165" y="345" width="35" height="28"/><text class="value" x="206" y="365">135.29</text><rect class="micro" x="165" y="380" width="234" height="28"/><text class="value" x="405" y="400">901.44</text>
    <rect class="mono" x="165" y="455" width="45" height="28"/><text class="value" x="216" y="475">174.02</text><rect class="micro" x="165" y="490" width="388" height="28"/><text class="value" x="559" y="510" text-anchor="end">1493.28</text>
    <rect class="mono" x="745" y="235" width="346" height="28"/><text class="value" x="1098" y="255" text-anchor="end">230.56</text><rect class="micro" x="745" y="270" width="57" height="28"/><text class="value" x="808" y="290">38.11</text>
    <rect class="mono" x="745" y="345" width="317" height="28"/><text class="value" x="1068" y="365">211.03</text><rect class="micro" x="745" y="380" width="42" height="28"/><text class="value" x="793" y="400">27.85</text>
    <rect class="mono" x="745" y="455" width="254" height="28"/><text class="value" x="1005" y="475">169.14</text><rect class="micro" x="745" y="490" width="26" height="28"/><text class="value" x="777" y="510">17.42</text>
  </g>
  <g class="legend"><rect class="mono" x="465" y="655" width="18" height="18"/><text x="490" y="670">单体</text><rect class="micro" x="565" y="655" width="18" height="18"/><text x="590" y="670">微服务</text></g>
  <text x="60" y="705" class="subtitle">数据来源：test-results/perf-monolith-20260903.json 与 perf-microservices-comparable-20260903.json</text>
</svg>

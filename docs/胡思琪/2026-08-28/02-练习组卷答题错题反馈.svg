<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1060" viewBox="0 0 1700 1060" role="img" aria-label="系统级顺序图 练习组卷答题错题反馈"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#111827"/></marker></defs><style>.p{fill:#f7f9fc;stroke:#2563eb;stroke-width:2.5}.l{stroke:#374151;stroke-width:2;stroke-dasharray:8 7}.m{stroke:#111827;stroke-width:2.2;fill:none;marker-end:url(#a)}.r{stroke:#111827;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#a)}.x{fill:#fffef0;stroke:#a16207;stroke-width:1.5}.t{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#111827;font-size:17px}.h{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#111827;font-size:28px;font-weight:bold}.s{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#374151;font-size:15px}</style><text class="h" x="850" y="42" text-anchor="middle">SYS-SEQ-08 REQ07 练习组卷、答题、错题与辅导</text><text class="t" x="78" y="118">学生</text><rect class="p" x="230" y="85" width="170" height="55"/><text class="t" x="315" y="120" text-anchor="middle">练习页面</text><rect class="p" x="545" y="85" width="175" height="55"/><text class="t" x="632" y="120" text-anchor="middle">练习管理</text><rect class="p" x="875" y="85" width="185" height="55"/><text class="t" x="967" y="120" text-anchor="middle">组卷与判分服务</text><rect class="p" x="1210" y="85" width="175" height="55"/><text class="t" x="1297" y="120" text-anchor="middle">练习与错题数据</text><rect class="p" x="1480" y="85" width="155" height="55"/><text class="t" x="1557" y="120" text-anchor="middle">辅导服务</text><path class="l" d="M82 145V985M315 140V985M632 140V985M967 140V985M1297 140V985M1557 140V985"/><path class="m" d="M82 200H632"/><text class="t" x="357" y="188" text-anchor="middle">1：选择智能/标签/错题/自定义练习</text><path class="m" d="M632 270H967"/><text class="t" x="800" y="258" text-anchor="middle">1.1：按模式筛选题目</text><path class="m" d="M967 325H1297"/><text class="t" x="1132" y="313" text-anchor="middle">1.2：查询题库与错题范围</text><path class="m" d="M967 385H1297"/><text class="t" x="1132" y="373" text-anchor="middle">1.3：创建 PracticeSession 与题目项</text><path class="r" d="M967 445H82"/><text class="t" x="525" y="435" text-anchor="middle">1.4：返回练习会话（不含预先暴露的答案）</text><path class="m" d="M82 530H632"/><text class="t" x="357" y="518" text-anchor="middle">2：保存逐题答案并提交会话</text><path class="m" d="M632 595H967"/><text class="t" x="800" y="583" text-anchor="middle">2.1：逐题判分并汇总得分</text><path class="m" d="M967 655H1297"/><text class="t" x="1132" y="643" text-anchor="middle">2.2：更新会话、题目统计和错题本</text><path class="r" d="M632 715H82"/><text class="t" x="357" y="705" text-anchor="middle">2.3：展示总分、解析与错题结果</text><path class="m" d="M82 790H632"/><text class="t" x="357" y="778" text-anchor="middle">3：请求提示/辅导或提交题目反馈</text><path class="m" d="M632 850H1557"/><text class="t" x="1095" y="838" text-anchor="middle">3.1：生成 AI 或本地模板提示</text><path class="r" d="M1557 905H82"/><text class="t" x="820" y="895" text-anchor="middle">3.2：返回辅导结果，不改写正式答案</text><rect class="x" x="975" y="935" width="555" height="57" rx="8"/><text class="s" x="995" y="960">分支结果：无匹配题目时不能创建空会话；AI 不可用时使用本地模板；</text><text class="s" x="995" y="982">题库、答案确认和反馈处理仅向教师/管理员开放。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="980" viewBox="0 0 1540 980" role="img" aria-label="REQ08 讨论活动图"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#111827"/></marker></defs><style>.s{fill:#f7f9fc;stroke:#2563eb;stroke-width:2.5}.f{fill:#fffef0;stroke:#a16207;stroke-width:1.5}.l{stroke:#111827;stroke-width:2.2;fill:none;marker-end:url(#a)}.t{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#111827;font-size:19px}.h{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#111827;font-size:28px;font-weight:bold}.n{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#374151;font-size:16px}</style><text class="h" x="770" y="45" text-anchor="middle">ACTIVITY-01 REQ08 讨论、提及与通知活动图</text><circle cx="770" cy="100" r="12" fill="#111827"/><rect class="s" x="630" y="145" width="280" height="60" rx="8"/><text class="t" x="770" y="183" text-anchor="middle">进入课程 / 实验讨论区</text><polygon points="770,270 825,325 770,380 715,325" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text class="n" x="770" y="331" text-anchor="middle">具有访问权限？</text><path class="l" d="M770 112V145M770 205V270"/><rect class="s" x="1050" y="295" width="260" height="60" rx="8"/><text class="t" x="1180" y="333" text-anchor="middle">提示无权访问并结束</text><path class="l" d="M825 325H1050"/><text class="n" x="930" y="312">否</text><rect class="s" x="630" y="440" width="280" height="60" rx="8"/><text class="t" x="770" y="478" text-anchor="middle">填写帖子/评论与可选附件</text><path class="l" d="M770 380V440"/><text class="n" x="787" y="410">是</text><polygon points="770,565 825,620 770,675 715,620" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text class="n" x="770" y="626" text-anchor="middle">内容和附件有效？</text><path class="l" d="M770 500V565"/><rect class="s" x="225" y="590" width="265" height="60" rx="8"/><text class="t" x="357" y="628" text-anchor="middle">提示并返回编辑</text><path class="l" d="M715 620H490"/><text class="n" x="600" y="607">否</text><path class="l" d="M357 590V470H630"/><rect class="s" x="630" y="745" width="280" height="60" rx="8"/><text class="t" x="770" y="783" text-anchor="middle">保存帖子、评论或附件</text><path class="l" d="M770 675V745"/><polygon points="1120,720 1175,775 1120,830 1065,775" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text class="n" x="1120" y="781" text-anchor="middle">是否提及成员？</text><path class="l" d="M910 775H1065"/><rect class="s" x="1300" y="745" width="190" height="60" rx="8"/><text class="t" x="1395" y="783" text-anchor="middle">生成站内通知</text><path class="l" d="M1175 775H1300"/><text class="n" x="1230" y="762">是</text><path class="l" d="M1120 830V875H770V805"/><text class="n" x="930" y="862">否或通知已生成</text><circle cx="770" cy="900" r="22" fill="#fff" stroke="#111827" stroke-width="2.5"/><circle cx="770" cy="900" r="12" fill="#111827"/><path class="l" d="M770 805V878"/><rect class="f" x="160" y="925" width="1220" height="38" rx="8"/><text class="n" x="185" y="951">后续操作：作者可编辑/删除，教师可置顶或处理；被提及用户打开通知后更新已读状态，问题解决后标记帖子已解决。</text></svg>

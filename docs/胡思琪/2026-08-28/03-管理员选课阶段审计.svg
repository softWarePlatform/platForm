<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1020" viewBox="0 0 1630 1020" role="img" aria-label="系统级顺序图 管理员选课阶段审计"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#111827"/></marker></defs><style>.p{fill:#f7f9fc;stroke:#2563eb;stroke-width:2.5}.l{stroke:#374151;stroke-width:2;stroke-dasharray:8 7}.m{stroke:#111827;stroke-width:2.2;fill:none;marker-end:url(#a)}.r{stroke:#111827;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#a)}.x{fill:#fffef0;stroke:#a16207;stroke-width:1.5}.t{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#111827;font-size:17px}.h{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#111827;font-size:28px;font-weight:bold}.s{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#374151;font-size:15px}</style><text class="h" x="815" y="42" text-anchor="middle">SYS-SEQ-09 REQ10 管理选课阶段、用户与审计</text><text class="t" x="72" y="118">管理员</text><rect class="p" x="220" y="85" width="175" height="55"/><text class="t" x="307" y="120" text-anchor="middle">管理端</text><rect class="p" x="535" y="85" width="170" height="55"/><text class="t" x="620" y="120" text-anchor="middle">管理员控制</text><rect class="p" x="850" y="85" width="175" height="55"/><text class="t" x="937" y="120" text-anchor="middle">选课管理</text><rect class="p" x="1165" y="85" width="175" height="55"/><text class="t" x="1252" y="120" text-anchor="middle">用户与审计数据</text><rect class="p" x="1455" y="85" width="125" height="55"/><text class="t" x="1517" y="120" text-anchor="middle">学生端</text><path class="l" d="M75 145V945M307 140V945M620 140V945M937 140V945M1252 140V945M1517 140V945"/><path class="m" d="M75 200H620"/><text class="t" x="347" y="188" text-anchor="middle">1：查看或配置选课阶段</text><path class="m" d="M620 265H937"/><text class="t" x="778" y="253" text-anchor="middle">1.1：读取/校验阶段和时间</text><path class="m" d="M937 325H1252"/><text class="t" x="1094" y="313" text-anchor="middle">1.2：保存 EnrollmentPeriod</text><path class="r" d="M937 380H75"/><text class="t" x="506" y="370" text-anchor="middle">1.3：配置已生效</text><path class="m" d="M75 465H620"/><text class="t" x="347" y="453" text-anchor="middle">2：查询用户、日志或完成情况</text><path class="m" d="M620 525H1252"/><text class="t" x="936" y="513" text-anchor="middle">2.1：读取用户、选课日志、通知和完成矩阵</text><path class="r" d="M1252 580H75"/><text class="t" x="665" y="570" text-anchor="middle">2.2：返回授权范围内的管理数据</text><path class="m" d="M75 655H620"/><text class="t" x="347" y="643" text-anchor="middle">3：执行受约束的用户管理</text><path class="m" d="M620 715H1252"/><text class="t" x="936" y="703" text-anchor="middle">3.1：校验不可删除当前管理员/至少保留一名管理员</text><path class="m" d="M620 770H1252"/><text class="t" x="936" y="758" text-anchor="middle">3.2：写入用户变更和管理员审计记录</text><path class="m" d="M937 830H1517"/><text class="t" x="1227" y="818" text-anchor="middle">4：新阶段影响学生选课状态与可执行操作</text><rect class="x" x="950" y="875" width="520" height="55" rx="8"/><text class="s" x="970" y="900">分支结果：非管理员访问被拒绝；开始晚于结束或阶段值无效不能保存；</text><text class="s" x="970" y="922">删除关联用户必须拒绝或按明确约束处理，不留下孤立记录。</text></svg>

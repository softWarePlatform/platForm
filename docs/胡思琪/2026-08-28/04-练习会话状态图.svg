<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="890" viewBox="0 0 1540 890" role="img" aria-label="REQ07 练习会话状态图"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#111827"/></marker></defs><style>.s{fill:#f7f9fc;stroke:#2563eb;stroke-width:2.5}.f{fill:#fffef0;stroke:#a16207;stroke-width:1.5}.l{stroke:#111827;stroke-width:2.2;fill:none;marker-end:url(#a)}.t{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#111827;font-size:19px}.h{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#111827;font-size:28px;font-weight:bold}.n{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#374151;font-size:16px}</style><text class="h" x="770" y="45" text-anchor="middle">STATE-04 REQ07 练习会话状态图</text><circle cx="105" cy="170" r="12" fill="#111827"/><rect class="s" x="225" y="135" width="185" height="65" rx="8"/><text class="t" x="317" y="175" text-anchor="middle">组卷中</text><rect class="s" x="530" y="135" width="185" height="65" rx="8"/><text class="t" x="622" y="175" text-anchor="middle">进行中</text><rect class="s" x="835" y="135" width="185" height="65" rx="8"/><text class="t" x="927" y="175" text-anchor="middle">已提交</text><rect class="s" x="1140" y="135" width="185" height="65" rx="8"/><text class="t" x="1232" y="175" text-anchor="middle">已判分</text><path class="l" d="M117 170H225M410 168H530M715 168H835M1020 168H1140"/><text class="n" x="170" y="155">选择练习模式</text><text class="n" x="470" y="155">题目生成成功</text><text class="n" x="775" y="155">学生提交会话</text><text class="n" x="1080" y="155">系统判分</text><rect class="s" x="835" y="355" width="190" height="65" rx="8"/><text class="t" x="930" y="395" text-anchor="middle">已放弃</text><path class="l" d="M622 200V387H835"/><text class="n" x="650" y="285">删除会话/退出练习</text><rect class="s" x="530" y="565" width="190" height="65" rx="8"/><text class="t" x="625" y="605" text-anchor="middle">生成失败</text><path class="l" d="M317 200V597H530"/><text class="n" x="345" y="410">无匹配题目或参数无效</text><path class="l" d="M1232 200V480H927V355"/><text class="n" x="1050" y="470">写入错题本、统计与结果</text><circle cx="1232" cy="585" r="22" fill="#fff" stroke="#111827" stroke-width="2.5"/><circle cx="1232" cy="585" r="12" fill="#111827"/><path class="l" d="M1232 200V563"/><text class="n" x="1250" y="360">会话归档</text><rect class="f" x="150" y="710" width="1210" height="75" rx="8"/><text class="n" x="175" y="740">对象依据：`PracticeSession.status` 为 `IN_PROGRESS → SUBMITTED → GRADED`；每次作答保存于 `PracticeSessionItem`，判分后更新错题和题目统计。</text><text class="n" x="175" y="768">“组卷中”“生成失败”“已放弃”为业务流转状态；正式判分前不向学生暴露标准答案。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="930" viewBox="0 0 1550 930" role="img" aria-label="REQ10 选课阶段活动图"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#111827"/></marker></defs><style>.s{fill:#f7f9fc;stroke:#2563eb;stroke-width:2.5}.f{fill:#fffef0;stroke:#a16207;stroke-width:1.5}.l{stroke:#111827;stroke-width:2.2;fill:none;marker-end:url(#a)}.t{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#111827;font-size:19px}.h{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#111827;font-size:28px;font-weight:bold}.n{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#374151;font-size:16px}</style><text class="h" x="775" y="45" text-anchor="middle">ACTIVITY-02 REQ10 选课阶段配置与生效活动图</text><circle cx="775" cy="100" r="12" fill="#111827"/><rect class="s" x="620" y="145" width="310" height="60" rx="8"/><text class="t" x="775" y="183" text-anchor="middle">管理员查看当前选课阶段</text><polygon points="775,270 830,325 775,380 720,325" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text class="n" x="775" y="331" text-anchor="middle">阶段值与时间合法？</text><path class="l" d="M775 112V145M775 205V270"/><rect class="s" x="1030" y="295" width="285" height="60" rx="8"/><text class="t" x="1172" y="333" text-anchor="middle">拒绝保存并提示修改</text><path class="l" d="M830 325H1030"/><text class="n" x="925" y="312">否</text><path class="l" d="M1172 295V175H930"/><rect class="s" x="620" y="440" width="310" height="60" rx="8"/><text class="t" x="775" y="478" text-anchor="middle">保存 EnrollmentPeriod 配置</text><path class="l" d="M775 380V440"/><text class="n" x="792" y="410">是</text><rect class="s" x="620" y="550" width="310" height="60" rx="8"/><text class="t" x="775" y="588" text-anchor="middle">记录管理员操作并更新状态查询</text><path class="l" d="M775 500V550"/><polygon points="775,675 830,730 775,785 720,730" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text class="n" x="775" y="736" text-anchor="middle">学生操作是否在当前阶段允许？</text><path class="l" d="M775 610V675"/><rect class="s" x="1050" y="700" width="260" height="60" rx="8"/><text class="t" x="1180" y="738" text-anchor="middle">拒绝选课/候补/退课</text><path class="l" d="M830 730H1050"/><text class="n" x="935" y="717">否</text><rect class="s" x="350" y="700" width="250" height="60" rx="8"/><text class="t" x="475" y="738" text-anchor="middle">允许对应选课操作</text><path class="l" d="M720 730H600"/><text class="n" x="645" y="717">是</text><circle cx="775" cy="850" r="22" fill="#fff" stroke="#111827" stroke-width="2.5"/><circle cx="775" cy="850" r="12" fill="#111827"/><path class="l" d="M475 760V825H775M1180 760V825H775"/><rect class="f" x="140" y="875" width="1270" height="35" rx="8"/><text class="n" x="165" y="899">阶段可取 PRESELECT、FORMAL、ADD_DROP、CLOSED；修改后 `/enrollment/status` 与选课服务的实际守卫条件必须一致。</text></svg>

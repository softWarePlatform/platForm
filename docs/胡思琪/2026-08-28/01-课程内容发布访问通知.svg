<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1050" viewBox="0 0 1680 1050" role="img" aria-label="系统级顺序图 课程内容发布访问通知"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#111827"/></marker></defs><style>.p{fill:#f7f9fc;stroke:#2563eb;stroke-width:2.5}.l{stroke:#374151;stroke-width:2;stroke-dasharray:8 7}.m{stroke:#111827;stroke-width:2.2;fill:none;marker-end:url(#a)}.r{stroke:#111827;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#a)}.x{fill:#fffef0;stroke:#a16207;stroke-width:1.5}.t{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#111827;font-size:17px}.h{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#111827;font-size:28px;font-weight:bold}.s{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#374151;font-size:15px}</style><text class="h" x="840" y="42" text-anchor="middle">SYS-SEQ-07 REQ03/REQ04 课程内容发布、访问与通知</text><text class="t" x="75" y="118">教师 / 学生</text><rect class="p" x="230" y="85" width="175" height="55"/><text class="t" x="317" y="120" text-anchor="middle">课程内容管理</text><rect class="p" x="570" y="85" width="190" height="55"/><text class="t" x="665" y="120" text-anchor="middle">课程访问控制</text><rect class="p" x="930" y="85" width="185" height="55"/><text class="t" x="1022" y="120" text-anchor="middle">公告与资料数据</text><rect class="p" x="1280" y="85" width="175" height="55"/><text class="t" x="1367" y="120" text-anchor="middle">通知服务</text><path class="l" d="M80 145V970M317 140V970M665 140V970M1022 140V970M1367 140V970"/><path class="m" d="M80 200H317"/><text class="t" x="198" y="188" text-anchor="middle">1：发布公告或上传资料</text><path class="m" d="M317 270H665"/><text class="t" x="491" y="258" text-anchor="middle">1.1：校验教师课程权限</text><path class="r" d="M665 320H317"/><text class="t" x="491" y="310" text-anchor="middle">1.2：访问结果</text><path class="m" d="M317 385H1022"/><text class="t" x="670" y="373" text-anchor="middle">1.3：保存公告或资料元数据/文件</text><path class="m" d="M317 450H1367"/><text class="t" x="842" y="438" text-anchor="middle">1.4：为课程成员生成通知</text><path class="r" d="M1367 505H317"/><text class="t" x="842" y="495" text-anchor="middle">1.5：发布成功</text><path class="m" d="M80 595H317"/><text class="t" x="198" y="583" text-anchor="middle">2：浏览公告/资料或打开通知</text><path class="m" d="M317 655H665"/><text class="t" x="491" y="643" text-anchor="middle">2.1：校验选课访问关系</text><path class="m" d="M317 715H1022"/><text class="t" x="670" y="703" text-anchor="middle">2.2：读取可见内容、资料或文件</text><path class="m" d="M317 770H1367"/><text class="t" x="842" y="758" text-anchor="middle">2.3：记录公告已读 / 更新通知已读</text><path class="r" d="M317 835H80"/><text class="t" x="198" y="825" text-anchor="middle">2.4：展示内容或下载结果</text><rect class="x" x="900" y="875" width="525" height="60" rx="8"/><text class="s" x="920" y="900">分支结果：非课程成员不可访问；文件超限或存储失败时不保留无效资料；</text><text class="s" x="920" y="922">通知失败不能丢失已保存的公告/资料主体，需保留可诊断信息。</text></svg>

name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*", "monolith-start"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the current commit to the production Kubernetes cluster
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: teaching_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d teaching_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://platform:platform@127.0.0.1:5432/teaching_platform?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-secret-not-used-outside-the-runner
      CORS_ORIGIN: http://127.0.0.1:4173

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            judge-worker/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --fund=false
          npm ci --prefix backend --no-audit --fund=false
          npm ci --prefix frontend --no-audit --fund=false
          npm ci --prefix judge-worker --no-audit --fund=false

      - name: Prepare database and Prisma clients
        run: |
          npm run db:migrate
          npm run db:seed
          cd judge-worker
          npx prisma generate --schema=../backend/prisma/schema.prisma

      - name: Build all applications
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Start applications
        run: |
          mkdir -p test-results
          npm run start --prefix backend > test-results/api.log 2>&1 &
          npm run start --prefix judge-worker > test-results/judge-worker.log 2>&1 &
          npm run preview --prefix frontend -- --host 127.0.0.1 --port 4173 > test-results/web.log 2>&1 &

      - name: Wait for applications
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/health/ready > /dev/null; then break; fi
            if [ "$attempt" = 60 ]; then
              echo "API did not become ready"
              exit 1
            fi
            sleep 2
          done
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            if [ "$attempt" = 30 ]; then
              echo "Web application did not become ready"
              exit 1
            fi
            sleep 2
          done

      - name: Run read-only integration smoke tests
        env:
          API_BASE_URL: http://127.0.0.1:3000
          WEB_BASE_URL: http://127.0.0.1:4173
        run: npm run test:integration

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  images:
    name: Build ${{ matrix.component }} image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - component: web
            context: .
            dockerfile: ./nginx/Dockerfile
          - component: judge-worker
            context: .
            dockerfile: ./judge-worker/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/teaching-platform-${{ matrix.component }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: true
          sbom: true

  deploy:
    name: Deploy to Kubernetes
    needs: images
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

    steps:
      - name: Check deployment configuration
        id: deployment-config
        shell: bash
        run: |
          if [[ -n "$KUBE_CONFIG_B64" && -n "$POSTGRES_PASSWORD" && -n "$DATABASE_URL" && -n "$JWT_SECRET" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped. Add KUBE_CONFIG_B64, POSTGRES_PASSWORD, DATABASE_URL and JWT_SECRET to the production environment secrets."
          fi

      - name: Check out repository
        if: steps.deployment-config.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up kubectl
        if: steps.deployment-config.outputs.ready == 'true'
        uses: azure/setup-kubectl@v4

      - name: Load kubeconfig
        if: steps.deployment-config.outputs.ready == 'true'
        shell: bash
        run: |
          KUBECONFIG_PATH="${RUNNER_TEMP}/kubeconfig"
          echo "$KUBE_CONFIG_B64" | base64 --decode > "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Create namespace and runtime secrets
        if: steps.deployment-config.outputs.ready == 'true'
        shell: bash
        run: |
          kubectl apply -f k8s/monolith/namespace.yaml
          kubectl --namespace teaching-platform create secret generic platform-secrets \
            --from-literal=POSTGRES_USER=platform \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DB=teaching_platform \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=CORS_ORIGIN="${CORS_ORIGIN:-true}" \
            --dry-run=client -o yaml | kubectl apply -f -
          if [[ -n "$GHCR_USERNAME" && -n "$GHCR_PAT" ]]; then
            kubectl --namespace teaching-platform create secret docker-registry ghcr-pull \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_USERNAME" \
              --docker-password="$GHCR_PAT" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Deploy current commit
        if: steps.deployment-config.outputs.ready == 'true'
        shell: bash
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/teaching-platform"
          kubectl kustomize k8s/monolith > "${RUNNER_TEMP}/platform.yaml"
          sed -i "s|teaching-platform-api:dev|${IMAGE_PREFIX}-api:sha-${GITHUB_SHA}|g" "${RUNNER_TEMP}/platform.yaml"
          sed -i "s|teaching-platform-web:dev|${IMAGE_PREFIX}-web:sha-${GITHUB_SHA}|g" "${RUNNER_TEMP}/platform.yaml"
          sed -i "s|teaching-platform-judge-worker:dev|${IMAGE_PREFIX}-judge-worker:sha-${GITHUB_SHA}|g" "${RUNNER_TEMP}/platform.yaml"
          kubectl apply -f "${RUNNER_TEMP}/platform.yaml"

      - name: Verify rollout
        if: steps.deployment-config.outputs.ready == 'true'
        run: |
          kubectl --namespace teaching-platform rollout status statefulset/postgres --timeout=180s
          kubectl --namespace teaching-platform rollout status deployment/redis --timeout=180s
          kubectl --namespace teaching-platform rollout status deployment/api --timeout=300s
          kubectl --namespace teaching-platform rollout status deployment/judge-worker --timeout=300s
          kubectl --namespace teaching-platform rollout status deployment/web --timeout=180s
          kubectl --namespace teaching-platform get pods,services

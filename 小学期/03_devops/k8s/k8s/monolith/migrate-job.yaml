apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: teaching-platform
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: teaching-platform
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: teaching-platform-migrate:dev
          imagePullPolicy: IfNotPresent
          command: [npx, --no-install, prisma, migrate, deploy]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

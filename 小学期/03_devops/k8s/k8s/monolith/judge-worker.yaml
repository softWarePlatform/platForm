apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: judge-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: judge-worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: judge-worker
          image: teaching-platform-judge-worker:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: LAB_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: REDIS_URL
            - name: JUDGE_QUEUE_NAME
              value: judge-submissions
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: JUDGE_TIMEOUT_MS
              value: "8000"
          startupProbe:
            exec:
              command: [sh, -c, "kill -0 1"]
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, "kill -0 1"]
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: api-uploads

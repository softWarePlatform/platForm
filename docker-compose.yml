# 本项目的 PostgreSQL 映射到宿主机 5433，避免与已有数据库（如 openGauss 5432:5432）冲突。
# 容器内仍监听 5432；从 Windows 本机连接请用 localhost:5433。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: teaching_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d teaching_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://platform:platform@db:5432/teaching_platform?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"

  judge-worker:
    build:
      context: .
      dockerfile: judge-worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://platform:platform@db:5432/teaching_platform?schema=public
      REDIS_URL: redis://redis:6379
      JUDGE_TIMEOUT_MS: "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:

# 宿主机默认使用 PostgreSQL 5433、Redis 6379、Web 8080；可在根目录 .env 覆盖。
x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@db:5432/${POSTGRES_DB:-teaching_platform}?schema=public
  REDIS_URL: redis://redis:6379
  JUDGE_QUEUE_NAME: judge-submissions
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-change-me}
  UPLOAD_DIR: /app/uploads

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_DB:-teaching_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    environment:
      <<: *app-environment
    command: ["npx", "--no-install", "prisma", "db", "seed"]
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      <<: *app-environment
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  lab-practice-service:
    build:
      context: .
      dockerfile: lab-practice-service/Dockerfile
      target: runtime
    environment:
      <<: *app-environment
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  judge-worker:
    build:
      context: .
      dockerfile: judge-worker/Dockerfile
      target: runtime
    environment:
      <<: *app-environment
      JUDGE_TIMEOUT_MS: "8000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      lab-practice-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  api_uploads:

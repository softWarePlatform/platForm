upstream api_upstream {
    least_conn;
    server api:3000;
    keepalive 32;
}

upstream lab_practice_upstream {
    least_conn;
    server lab-practice-service:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location ~ ^/api/(lab-sets|labs|submissions|practice|discussion-attachments)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://lab_practice_upstream;
    }

    location ~ ^/api/courses/[^/]+/(labs|lab-sets|practice|discussions|discussion-members)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://lab_practice_upstream;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api_upstream/;
    }

    location /api/notifications/events {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://api_upstream/notifications/events;
    }

    location /health {
        proxy_pass http://api_upstream/health;
    }

    location /lab-practice-health/ {
        rewrite ^/lab-practice-health/(.*)$ /health/$1 break;
        proxy_pass http://lab_practice_upstream;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
